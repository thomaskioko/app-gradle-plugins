site_name: App Gradle Plugins
site_description: Gradle plugins for building Kotlin Multiplatform and Android projects
site_author: Thomas Kioko
site_url: https://thomaskioko.github.io/app-gradle-plugins/

repo_name: thomaskioko/app-gradle-plugins
repo_url: https://github.com/thomaskioko/app-gradle-plugins
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Thomas Kioko

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path: [snippets]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Installing: install.md
  - Plugins:
      - Overview: plugins/index.md
      - Root: plugins/root.md
      - App: plugins/app.md
      - Android: plugins/android.md
      - JVM: plugins/jvm.md
      - Multiplatform: plugins/multiplatform.md
      - Base: plugins/base.md
      - Spotless: plugins/spotless.md
      - Lint: plugins/lint.md
      - Baseline profile: plugins/baseline-profile.md
      - Resource generator: plugins/resource-generator.md
      - Build config: plugins/buildconfig.md
      - API reference: api/plugins/index.html
  - Navigation:
      - Get started: navigation/get-started.md
      - Annotations: navigation/annotations.md
      - Examples: navigation/examples.md
      - API reference: api/codegen/index.html
  - Feature flags:
      - Get started: feature-flags.md
      - API reference: api/codegen/index.html
  - Lint rules:
      - Rules: lint-rules.md
      - API reference: api/lint-rules/index.html
  - Internals:
      - Overview: internals/index.md
      - Pipeline: internals/pipeline.md
      - Parsers: internals/parsers.md
      - Generators: internals/generators.md
      - Data model: internals/data-model.md
      - Consumer contract: internals/consumer-contract.md
      - Testing: internals/testing.md
  - Change log: changelog.md
  - Releasing: releasing.md
